<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta
      content="A hackathon platform for builders, by builders. Discover events, form teams, build projects, win prizes."
      name="description"
    >
    <title>rave — Hackathon Platform</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
    <link href="https://api.fontshare.com" rel="preconnect">
    <link crossorigin href="https://cdn.fontshare.com" rel="preconnect">
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet"
    >
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <script>
    "use strict";
    // Apply the stored theme before first paint. next-themes only syncs the
    // class on mount, so without this the page renders light, then snaps to
    // dark for anyone who chose it. The storage key and the `system`
    // resolution mirror what ThemeProvider is configured with in __root.tsx;
    // change one and you must change the other.
    (() => {
      try {
        const stored = localStorage.getItem("rave-theme") || "light";
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const dark = stored === "dark" || (stored === "system" && prefersDark);
        document.documentElement.classList.toggle("dark", dark);
      } catch {
        // Private mode or a blocked storage partition: fall back to light
        // rather than leaving the class in an unknown state.
        document.documentElement.classList.remove("dark");
      }
    })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
