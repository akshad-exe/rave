name: rave

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3000
    init: true
    ports:
      - "3001:80"
    env_file:
      - path: apps/web/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      # The image is a prebuilt binary: there is no watcher and no source to
      # reload, so development mode buys nothing and actively breaks the
      # container. It would also re-enable the varlock CLI load and pino-pretty,
      # neither of which exists in the single-file image. Set explicitly because
      # env_file above carries NODE_ENV=development for host-side `bun run dev`.
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3001
      BETTER_AUTH_URL: http://localhost:3000
      # BETTER_AUTH_SECRET is deliberately NOT set here. In Compose, `environment`
      # wins over `env_file`, so setting it here silently overrode the secret in
      # apps/server/.env: the host minted session cookies with one value and the
      # container verified them against another, so every authenticated request
      # 401'd while the checker still reported a pass.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-ravepass}@postgres:5432/rave
      MIGRATIONS_FOLDER: /app/packages/db/src/migrations
    healthcheck:
      # curl, not `node -e`: the runtime image ships the compiled binary and no
      # node runtime, so a node-based probe would report unhealthy forever.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: rave-postgres
    environment:
      POSTGRES_DB: rave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ravepass}
    ports:
      - "5432:5432"
    volumes:
      - rave_postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  rave_postgres_data:

